{% extends "tickets/base.html" %}

{% block breadcrumb_extra %}
<li>
  <div class="flex items-center">
    <svg class="flex-shrink-0 h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L12.586 8 7.293 2.707a1 1 0 011.414-1.414l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414 0z" clip-rule="evenodd" />
    </svg>
    <span class="ml-4 text-sm font-medium text-gray-500">Nouveau Ticket</span>
  </div>
</li>
{% endblock %}

{% block content %}
<div class="py-6">
  <div class="px-4 sm:px-6 md:px-0">
    <div class="bg-white rounded-lg shadow">
      <div class="px-4 py-5 sm:p-6">
        <h2 class="text-lg font-medium text-gray-900 mb-6">Créer un nouveau ticket support</h2>
        
        <form method="POST" class="space-y-6">
          <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
            <!-- Établissement -->
            <div>
              <label for="etablissement_id" class="block text-sm font-medium text-gray-700">Présignation Établissement *</label>
              <select name="etablissement_id" id="etablissement_id" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border px-3 py-2">
                <option value="">-- Sélectionner --</option>
                {% for etab in etablissements %}
                <option value="{{ etab.id }}">{{ etab.nom }}</option>
                {% endfor %}
              </select>
            </div>

            <!-- Catégorie -->
            <div>
              <label for="categorie" class="block text-sm font-medium text-gray-700">Catégorie *</label>
              <select name="categorie" id="categorie" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border px-3 py-2">
                <option value="">-- Sélectionner --</option>
                <option value="BUG">Bug/Erreur</option>
                <option value="FEATURE">Demande Fonctionnalité</option>
                <option value="QUESTION">Question/Support</option>
                <option value="AUTRE">Autre</option>
              </select>
            </div>

            <!-- Priorité -->
            <div>
              <label for="priorite" class="block text-sm font-medium text-gray-700">Priorité</label>
              <select name="priorite" id="priorite" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border px-3 py-2">
                <option value="NORMALE" selected>Normale</option>
                <option value="BASSE">Basse</option>
                <option value="HAUTE">Haute</option>
                <option value="URGENTE">Urgente</option>
              </select>
            </div>

            <!-- Technicien -->
            <div>
              <label for="technicien_id" class="block text-sm font-medium text-gray-700">Assigner à un technicien</label>
              <select name="technicien_id" id="technicien_id" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border px-3 py-2">
                <option value="">-- Non assigné --</option>
                {% for tech in techniciens %}
                <option value="{{ tech.id }}">{{ tech.nom }}</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <!-- Titre -->
          <div>
            <label for="titre" class="block text-sm font-medium text-gray-700">Titre *</label>
            <input type="text" name="titre" id="titre" required placeholder="Descrirez brièvement le problème" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border px-3 py-2">
          </div>

          <!-- Description -->
          <div>
            <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
            <textarea name="description" id="description" rows="5" placeholder="Décrivez le problème de manière détaillée..." class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border px-3 py-2"></textarea>
          </div>

          <!-- Actions -->
          <div class="flex justify-end space-x-4">
            <a href="{{ url_for('tickets.index') }}" class="px-4 py-2 border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">Annuler</a>
            <button type="submit" class="px-4 py-2 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">Créer le ticket</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
