{% extends "installations/base.html" %}

{% block breadcrumb_extra %}
<li>
  <div class="flex items-center">
    <svg class="flex-shrink-0 h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L12.586 8 7.293 2.707a1 1 0 011.414-1.414l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414 0z" clip-rule="evenodd" />
    </svg>
    <span class="ml-4 text-sm font-medium text-gray-500">Modifier Installation #{{ installation.id }}</span>
  </div>
</li>
{% endblock %}

{% block content %}
<div class="py-6">
  <div class="px-4 sm:px-6 md:px-0">
    <div class="bg-white rounded-lg shadow">
      <div class="px-4 py-5 sm:p-6">
        <h2 class="text-lg font-medium text-gray-900 mb-6">Modifier l'installation</h2>
        
        <form method="POST" class="space-y-6">
          <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
            <!-- Type d'installation -->
            <div>
              <label for="type_installation" class="block text-sm font-medium text-gray-700">Type d'installation</label>
              <select name="type_installation" id="type_installation" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border px-3 py-2">
                <option value="INITIALE" {% if installation.type_installation == 'INITIALE' %}selected{% endif %}>Installation Initiale</option>
                <option value="MAINTENANCE" {% if installation.type_installation == 'MAINTENANCE' %}selected{% endif %}>Maintenance</option>
                <option value="UPGRADE" {% if installation.type_installation == 'UPGRADE' %}selected{% endif %}>Upgrade</option>
              </select>
            </div>

            <!-- Statut -->
            <div>
              <label for="statut" class="block text-sm font-medium text-gray-700">Statut</label>
              <select name="statut" id="statut" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border px-3 py-2">
                <option value="EN_ATTENTE" {% if installation.statut == 'EN_ATTENTE' %}selected{% endif %}>En Attente</option>
                <option value="EN_COURS" {% if installation.statut == 'EN_COURS' %}selected{% endif %}>En Cours</option>
                <option value="TERMINEES" {% if installation.statut == 'TERMINEES' %}selected{% endif %}>Terminée</option>
              </select>
            </div>

            <!-- Technicien -->
            <div>
              <label for="technicien_id" class="block text-sm font-medium text-gray-700">Technicien</label>
              <select name="technicien_id" id="technicien_id" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border px-3 py-2">
                <option value="">-- Aucun --</option>
                {% for tech in techniciens %}
                <option value="{{ tech.id }}" {% if installation.technicien_id == tech.id %}selected{% endif %}>{{ tech.nom }}</option>
                {% endfor %}
              </select>
            </div>

            <!-- Date installation -->
            <div>
              <label for="date_installation" class="block text-sm font-medium text-gray-700">Date et heure</label>
              <input type="datetime-local" name="date_installation" id="date_installation" value="{% if installation.date_installation %}{{ installation.date_installation.strftime('%Y-%m-%dT%H:%M') }}{% endif %}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border px-3 py-2">
            </div>
          </div>

          <!-- Commentaire -->
          <div>
            <label for="commentaire" class="block text-sm font-medium text-gray-700">Commentaire</label>
            <textarea name="commentaire" id="commentaire" rows="4" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border px-3 py-2">{{ installation.commentaire|default('') }}</textarea>
          </div>

          <!-- Actions -->
          <div class="flex justify-end space-x-4">
            <a href="{{ url_for('installations.view', id=installation.id) }}" class="px-4 py-2 border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">Annuler</a>
            <button type="submit" class="px-4 py-2 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">Enregistrer</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
